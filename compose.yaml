name: supportflow-ai
services:
  app:
    build: .
    ports: ["8205:8000"]
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_DATABASE: supportflow_ai
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
    volumes: ["storage:/app/storage"]
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: supportflow_ai
      MYSQL_USER: izahar
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a local MySQL root password}
    volumes: ["mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    volumes: ["redis:/data"]
    command: ["redis-server", "--appendonly", "yes"]
volumes:
  mysql:
  storage:
  redis:
